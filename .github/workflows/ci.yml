name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sporafind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U postgres
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          python -c "
import asyncio, asyncpg, time
async def wait_for_pg():
    for i in range(30):
        try:
            conn = await asyncpg.connect('postgresql://postgres:postgres@localhost:5432/sporafind_test')
            print('Postgres ready:', await conn.fetchval('SELECT version()'))
            await conn.close()
            return
        except Exception as e:
            print(f'Waiting for PG ({i+1}/30): {e}')
            await asyncio.sleep(2)
    raise SystemExit(1)
asyncio.run(wait_for_pg())
"

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sporafind_test
          ADMIN_KEY: test-admin-key
          ENVIRONMENT: test
        run: pytest -v --tb=short

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
