name: secret-scan
# Token-free full-history scan: works on push + PR in every repo regardless of
# Actions permission settings (the gitleaks-action wrapper needs PR API access).
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install Gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/g.tar.gz
          tar xzf /tmp/g.tar.gz -C /tmp && sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Scan full history (redacted)
        run: gitleaks detect --source . --verbose --redact
