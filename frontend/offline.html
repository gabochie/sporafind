<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080D1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sporafind">
<meta name="mobile-web-app-capable" content="yes">
<title>Offline — Sporafind</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/tokens.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom));text-align:center}
h1{font-size:clamp(24px,5vw,40px);margin:16px 0 8px}
p{color:rgba(255,255,255,.65);font-size:15px;max-width:420px;margin:0 auto 20px}
.mark{width:56px;height:56px;border-radius:14px;background:#006B3C;display:inline-flex;align-items:center;justify-content:center;font-size:28px;color:#D4A017;font-weight:800}
button{background:#D4A017;color:#0A0E1A;border:0;border-radius:10px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer}
a{color:#00a85a}
</style>
</head>
<body>
<div>
<div class="mark">★</div>
<h1>You're offline</h1>
<p>Sporafind needs a connection for fresh intelligence. Check your connection — cached pages remain available via your history.</p>
<button onclick="location.reload()">Try again</button>
<p style="margin-top:16px"><a href="/">← Back to sporafind.com</a></p>
</div>
</body>
</html>
