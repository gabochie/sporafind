<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sporafind Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --s0:#0b0b0b;--s1:#141414;--s2:#1e1e1e;--s3:#2a2a2a;
  --bd:#2a2a2a;--bds:#383838;
  --t1:#ededed;--t2:#999;--tm:#555;
  --green:#006B3C;--gl:#00a85a;--gold:#D4A017;--blue:#2563EB;--red:#ef4444;
  --ff:'Inter',system-ui,-apple-system,sans-serif;
  --radius:10px;--radius-sm:7px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--s0);}
body{font-family:var(--ff);background:var(--s0);color:var(--t1);min-height:100vh;}

/* Login */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 0%,#0a2e1a 0%,var(--s0) 60%);padding:24px;
}
.login-card{
  background:var(--s1);border:1px solid var(--bds);border-radius:16px;
  padding:40px;max-width:400px;width:100%;text-align:center;
}
.login-card .logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:20px;text-decoration:none;}
.login-card .logomark{width:36px;height:36px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.login-card .logomark::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#ffffff15,transparent 50%);}
.login-card .star{width:16px;height:16px;background:var(--gold);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.login-card .logotext{font-family:var(--ff);font-size:18px;font-weight:700;letter-spacing:-.3px;color:var(--t1);}
.login-card .logotext span{color:var(--gold);}
.login-card h2{font-size:20px;font-weight:700;margin-bottom:4px;}
.login-card p{font-size:13px;color:var(--t2);margin-bottom:20px;}
.login-card input{
  width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--bds);
  background:var(--s2);color:var(--t1);font-family:var(--ff);font-size:14px;
  outline:none;transition:border-color .15s;margin-bottom:12px;
}
.login-card input:focus{border-color:var(--green);}
.login-card button{
  width:100%;padding:12px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--gold),#b88912);color:#1a1200;
  font-size:14px;font-weight:600;font-family:var(--ff);cursor:pointer;transition:all .15s;
}
.login-card button:hover{background:linear-gradient(135deg,#c49015,#a37a10);}
.login-card .error{color:var(--red);font-size:12px;margin-top:8px;display:none;}

/* App layout */
.admin-app{display:none;min-height:100vh;}
.topbar{
  background:var(--s1);border-bottom:1px solid var(--bd);
  padding:11px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;
}
.topbar .logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.topbar .logomark{width:28px;height:28px;border-radius:7px;background:var(--green);display:flex;align-items:center;justify-content:center;}
.topbar .star{width:13px;height:13px;background:var(--gold);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
.topbar .logotext{font-size:14px;font-weight:700;color:var(--t1);}
.topbar .logotext span{color:var(--gold);}
.topbar .admin-badge{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--gold);background:rgba(212,160,23,.1);padding:4px 10px;border-radius:20px;border:1px solid rgba(212,160,23,.2);}
.topbar .logout-btn{
  padding:6px 12px;border:1px solid var(--bds);border-radius:var(--radius-sm);
  background:transparent;font-size:12px;color:var(--t2);cursor:pointer;font-family:var(--ff);transition:all .15s;
}
.topbar .logout-btn:hover{background:var(--s2);color:var(--t1);}

.body{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:calc(100vh - 53px);}
.sidebar{border-right:1px solid var(--bd);padding:10px 0;background:var(--s1);}
.si{
  display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;
  font-size:12px;color:var(--t2);transition:all .1s;border-left:2px solid transparent;
}
.si:hover{background:var(--s2);color:var(--t1);}
.si.active{background:var(--s2);border-left-color:var(--gold);color:var(--t1);font-weight:500;}
.si i{font-size:16px;width:18px;text-align:center;}

.main{padding:18px 22px;overflow-y:auto;}
.page-title{font-size:18px;font-weight:700;margin-bottom:2px;}
.page-desc{font-size:12px;color:var(--tm);margin-bottom:18px;}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px;}
.stat-card{
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);
  padding:14px 16px;position:relative;overflow:hidden;
}
.stat-card .sc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.stat-card .sc-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.stat-card .sc-label{font-size:10px;color:var(--tm);font-weight:500;text-transform:uppercase;letter-spacing:.6px;}
.stat-card .sc-val{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.stat-card .sc-sub{font-size:10px;color:var(--tm);margin-top:2px;}
.card-green .sc-icon{background:rgba(0,107,60,.2);color:var(--gl);}
.card-gold .sc-icon{background:rgba(212,160,23,.15);color:var(--gold);}
.card-blue .sc-icon{background:rgba(37,99,235,.15);color:var(--blue);}

/* Tables */
.table-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);overflow-x:auto;margin-bottom:20px;}
.table-wrap .tw-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--bd);}
.table-wrap .tw-h h3{font-size:13px;font-weight:600;}
.tw-actions{display:flex;gap:6px;align-items:center;}
.tw-actions select,.tw-actions input{
  padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--bds);
  background:var(--s2);color:var(--t1);font-family:var(--ff);font-size:12px;outline:none;
}
.tw-actions select:focus,.tw-actions input:focus{border-color:var(--green);}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{padding:10px 14px;text-align:left;font-weight:600;color:var(--tm);font-size:10px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--bd);white-space:nowrap;}
td{padding:9px 14px;border-bottom:1px solid var(--bd);color:var(--t2);}
tr:hover td{background:var(--s2);}
tr:last-child td{border-bottom:none;}
.badge{
  display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;
}
.badge-green{background:rgba(0,107,60,.15);color:var(--gl);}
.badge-red{background:rgba(239,68,68,.15);color:var(--red);}
.badge-gold{background:rgba(212,160,23,.15);color:var(--gold);}
.badge-blue{background:rgba(37,99,235,.15);color:var(--blue);}
.empty{text-align:center;padding:32px 16px;color:var(--tm);grid-column:1/-1;}
.empty i{font-size:28px;margin-bottom:8px;display:block;color:var(--bds);}
.loading{text-align:center;padding:24px;color:var(--tm);}
.loading i{animation:spin 1s linear infinite;display:block;margin-bottom:6px;font-size:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;}
.pagination button{
  padding:5px 12px;border:1px solid var(--bd);border-radius:var(--radius-sm);
  background:var(--s2);color:var(--t2);font-size:12px;cursor:pointer;font-family:var(--ff);
}
.pagination button:hover{background:var(--s3);color:var(--t1);}
.pagination button:disabled{opacity:.4;cursor:default;}
.pagination span{font-size:11px;color:var(--tm);}

/* Action buttons in table */
.btn-sm{
  padding:4px 8px;border:1px solid var(--bd);border-radius:5px;background:var(--s2);
  color:var(--t2);font-size:10px;cursor:pointer;font-family:var(--ff);transition:all .12s;
}
.btn-sm:hover{background:var(--s3);color:var(--t1);}
.btn-sm.danger{border-color:rgba(239,68,68,.2);color:var(--red);}
.btn-sm.danger:hover{background:rgba(239,68,68,.1);}
.btn-sm.gold{background:linear-gradient(135deg,var(--gold),#b88912);color:#1a1200;border:none;padding:5px 10px;font-size:11px;font-weight:600;}
.btn-sm.gold:hover{background:linear-gradient(135deg,#c49015,#a37a10);}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal{
  background:var(--s1);border:1px solid var(--bds);border-radius:14px;
  padding:28px;max-width:480px;width:100%;position:relative;
  animation:modalIn .25s cubic-bezier(.22,1,.36,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px;}
.modal p{font-size:12px;color:var(--t2);margin-bottom:16px;}
.modal label{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:4px;margin-top:12px;}
.modal label:first-of-type{margin-top:0;}
.modal input,.modal select{
  width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--bds);
  background:var(--s2);color:var(--t1);font-family:var(--ff);font-size:13px;outline:none;
}
.modal input:focus,.modal select:focus{border-color:var(--green);}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.modal .modal-actions button{padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--ff);}
.modal .modal-actions .btn-cancel{background:var(--s2);border:1px solid var(--bd);color:var(--t2);}
.modal .modal-actions .btn-cancel:hover{background:var(--s3);}
.modal .modal-actions .btn-save{background:linear-gradient(135deg,var(--gold),#b88912);border:none;color:#1a1200;font-weight:600;}
.modal .modal-actions .btn-save:hover{background:linear-gradient(135deg,#c49015,#a37a10);}
.modal .modal-close{
  position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--bd);background:var(--s2);color:var(--t2);font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* Health */
.health-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.health-item{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;}
.health-item .hi-label{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.health-item .hi-val{font-size:16px;font-weight:600;}
.health-item .hi-val.ok{color:var(--gl);}
.health-item .hi-val.fail{color:var(--red);}

/* Import */
.import-box{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:20px;}
.import-box .ib-icon{width:48px;height:48px;border-radius:12px;background:rgba(212,160,23,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px;color:var(--gold);}
.import-box h3{font-size:15px;font-weight:600;margin-bottom:4px;}
.import-box p{font-size:12px;color:var(--t2);margin-bottom:16px;}
.import-box button{
  padding:10px 24px;border:none;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--gold),#b88912);color:#1a1200;
  font-size:13px;font-weight:600;cursor:pointer;font-family:var(--ff);
}
.import-box button:hover{background:linear-gradient(135deg,#c49015,#a37a10);}
.import-box button:disabled{opacity:.4;cursor:default;}

@media(max-width:800px){
  .body{grid-template-columns:1fr;}
  .sidebar{display:flex;gap:0;overflow-x:auto;padding:0;border-right:none;border-bottom:1px solid var(--bd);}
  .sidebar .si{border-left:none;border-bottom:2px solid transparent;white-space:nowrap;padding:10px 14px;}
  .sidebar .si.active{border-left:none;border-bottom-color:var(--gold);}
  .cards{grid-template-columns:repeat(2,1fr);}
  .health-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="logo">
      <div class="logomark"><div class="star"></div></div>
      <div class="logotext">Spora<span>find</span></div>
    </div>
    <h2>Admin Dashboard</h2>
    <p>Enter your admin key to continue</p>
    <form onsubmit="adminLogin(event)">
      <input id="admin-key-input" type="password" placeholder="Admin key" required autocomplete="off">
      <button type="submit">Sign in <i class="ti ti-arrow-right"></i></button>
    </form>
    <div class="error" id="login-error">Invalid admin key</div>
  </div>
</div>

<div id="admin-app" class="admin-app">
  <div class="topbar">
    <a class="logo" href="#">
      <div class="logomark"><div class="star"></div></div>
      <div class="logotext">Spora<span>find</span> <span class="admin-badge">Admin</span></div>
    </a>
    <button class="logout-btn" onclick="adminLogout()"><i class="ti ti-logout"></i> Sign out</button>
  </div>
  <div class="body">
    <div class="sidebar" id="admin-sidebar">
      <div class="si active" data-tab="overview" onclick="switchTab('overview',this)"><i class="ti ti-dashboard"></i> Overview</div>
      <div class="si" data-tab="users" onclick="switchTab('users',this)"><i class="ti ti-users"></i> Users</div>
      <div class="si" data-tab="profiles" onclick="switchTab('profiles',this)"><i class="ti ti-id"></i> Profiles</div>
      <div class="si" data-tab="orgs" onclick="switchTab('orgs',this)"><i class="ti ti-building-community"></i> Orgs</div>
      <div class="si" data-tab="import" onclick="switchTab('import',this)"><i class="ti ti-database-import"></i> Data Import</div>
      <div class="si" data-tab="health" onclick="switchTab('health',this)"><i class="ti ti-heartbeat"></i> Health</div>
    </div>
    <div class="main" id="admin-main"></div>
  </div>
</div>

<script>
const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
  ? "http://localhost:8000" : "https://sporafind-api.vercel.app";
const ADMIN_KEY = "sf-admin-key";

let adminKey = localStorage.getItem(ADMIN_KEY) || "";
let curTab = "overview";

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    headers: { "X-Admin-Key": adminKey }
  });
  if (res.status === 401) { adminLogout(); throw new Error("Unauthorized"); }
  if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
  return res.json();
}

async function apiPatch(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json", "X-Admin-Key": adminKey },
    body: JSON.stringify(body),
  });
  if (res.status === 401) { adminLogout(); return null; }
  if (!res.ok) throw new Error(`PATCH ${path} failed: ${res.status}`);
  return res.json();
}

async function apiDelete(path) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "DELETE",
    headers: { "X-Admin-Key": adminKey }
  });
  if (res.status === 401) { adminLogout(); return null; }
  if (!res.ok) throw new Error(`DELETE ${path} failed: ${res.status}`);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Key": adminKey },
    body: JSON.stringify(body || {}),
  });
  if (res.status === 401) { adminLogout(); return null; }
  if (!res.ok) throw new Error(`POST ${path} failed: ${res.status}`);
  return res.json();
}

/* Auth */
async function adminLogin(e) {
  e.preventDefault();
  const key = document.getElementById("admin-key-input").value.trim();
  if (!key) return;
  adminKey = key;
  try {
    const data = await apiGet("/admin/verify");
    if (data.status === "ok") {
      localStorage.setItem(ADMIN_KEY, key);
      document.getElementById("login-page").style.display = "none";
      document.getElementById("admin-app").style.display = "";
      switchTab("overview");
    }
  } catch {
    document.getElementById("login-error").style.display = "block";
    adminKey = "";
  }
}

function adminLogout() {
  localStorage.removeItem(ADMIN_KEY);
  adminKey = "";
  document.getElementById("admin-app").style.display = "none";
  document.getElementById("login-page").style.display = "";
  document.getElementById("admin-key-input").value = "";
  document.getElementById("login-error").style.display = "none";
}

/* Tab switching */
function switchTab(tab, el) {
  curTab = tab;
  document.querySelectorAll(".sidebar .si").forEach(s => s.classList.remove("active"));
  if (el) el.classList.add("active");
  renderTab(tab);
}

function renderTab(tab) {
  const main = document.getElementById("admin-main");
  if (tab === "overview") renderOverview(main);
  else if (tab === "users") renderUsers(main);
  else if (tab === "profiles") renderProfiles(main);
  else if (tab === "orgs") renderOrgs(main);
  else if (tab === "import") renderImport(main);
  else if (tab === "health") renderHealth(main);
}

/* Overview */
async function renderOverview(main) {
  main.innerHTML = `<div class="page-title">Dashboard Overview</div><div class="page-desc">High-level metrics across the platform</div><div class="loading"><i class="ti ti-loader"></i><p>Loading...</p></div>`;
  try {
    const d = await apiGet("/admin/analytics");
    main.innerHTML = `
      <div class="page-title">Dashboard Overview</div>
      <div class="page-desc">High-level metrics across the platform</div>
      <div class="cards">
        <div class="stat-card card-green"><div class="sc-top"><div class="sc-icon"><i class="ti ti-users"></i></div><i class="ti ti-arrow-up" style="color:var(--gl);font-size:14px;"></i></div><div class="sc-label">Total Profiles</div><div class="sc-val">${(d.total_profiles||0).toLocaleString()}</div><div class="sc-sub">${(d.active_profiles||0).toLocaleString()} active</div></div>
        <div class="stat-card card-gold"><div class="sc-top"><div class="sc-icon"><i class="ti ti-building-community"></i></div></div><div class="sc-label">Organisations</div><div class="sc-val">${(d.total_orgs||0).toLocaleString()}</div><div class="sc-sub">Companies House</div></div>
        <div class="stat-card card-blue"><div class="sc-top"><div class="sc-icon"><i class="ti ti-users"></i></div></div><div class="sc-label">Users</div><div class="sc-val">${(d.total_users||0).toLocaleString()}</div><div class="sc-sub">Registered accounts</div></div>
        <div class="stat-card card-green"><div class="sc-top"><div class="sc-icon"><i class="ti ti-world"></i></div></div><div class="sc-label">Countries</div><div class="sc-val">${(d.total_countries||0).toLocaleString()}</div><div class="sc-sub">Diaspora coverage</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="table-wrap"><div class="tw-h"><h3>Segments</h3></div>${renderSegmentsTable(d.segments||{})}</div>
        <div class="table-wrap"><div class="tw-h"><h3>Origins</h3></div>${renderOriginsTable(d.origins||{})}</div>
      </div>`;
  } catch { main.innerHTML = `<div class="page-title">Dashboard Overview</div><div class="page-desc">High-level metrics</div><div class="empty"><i class="ti ti-cloud-off"></i><p>Could not load analytics</p></div>`; }
}

function renderSegmentsTable(seg) {
  const entries = Object.entries(seg);
  if (!entries.length) return `<div class="empty"><p>No segment data</p></div>`;
  return `<table><thead><tr><th>Segment</th><th>Count</th></tr></thead><tbody>${entries.map(([k,v])=>`<tr><td>${k||"Unsegmented"}</td><td>${v.toLocaleString()}</td></tr>`).join("")}</tbody></table>`;
}

function renderOriginsTable(orig) {
  const entries = Object.entries(orig);
  if (!entries.length) return `<div class="empty"><p>No origin data</p></div>`;
  return `<table><thead><tr><th>Origin</th><th>Count</th></tr></thead><tbody>${entries.map(([k,v])=>`<tr><td>${k||"Unknown"}</td><td>${v.toLocaleString()}</td></tr>`).join("")}</tbody></table>`;
}

/* Users */
let usersPage = 1;
async function renderUsers(main) {
  main.innerHTML = `<div class="page-title">Users</div><div class="page-desc">Manage registered users and their access</div><div class="loading"><i class="ti ti-loader"></i><p>Loading...</p></div>`;
  try {
    const d = await apiGet(`/admin/users?page=${usersPage}&page_size=50`);
    main.innerHTML = `
      <div class="page-title">Users</div><div class="page-desc">Manage registered users and their access</div>
      <div class="table-wrap">
        <div class="tw-h"><h3>All users (${d.total})</h3></div>
        <table><thead><tr><th>Email</th><th>Name</th><th>Plan</th><th>Status</th><th>Exports</th><th>Created</th><th>Actions</th></tr></thead><tbody>
          ${d.items.map(u => `<tr>
            <td>${u.email}</td>
            <td>${u.name||"—"}</td>
            <td><span class="badge ${u.plan_tier==='free'?'badge-blue':'badge-gold'}">${u.plan_tier}</span></td>
            <td><span class="badge ${u.is_active?'badge-green':'badge-red'}">${u.is_active?'Active':'Inactive'}</span></td>
            <td>${u.export_count||0}</td>
            <td>${u.created_at?.slice(0,10)||"—"}</td>
            <td><button class="btn-sm" onclick="editUser('${u.id}','${u.plan_tier}',${u.is_active})"><i class="ti ti-edit"></i></button></td>
          </tr>`).join("")}
        </tbody></table>
        <div class="pagination"><button onclick="usersPage--;renderUsers(document.getElementById('admin-main'))" ${usersPage<=1?'disabled':''}>Prev</button><span>Page ${d.page} of ${Math.ceil(d.total/d.page_size)}</span><button onclick="usersPage++;renderUsers(document.getElementById('admin-main'))" ${d.page*d.page_size>=d.total?'disabled':''}>Next</button></div>
      </div>`;
  } catch { main.innerHTML = `<div class="page-title">Users</div><div class="page-desc">Manage registered users</div><div class="empty"><i class="ti ti-cloud-off"></i><p>Could not load users</p></div>`; }
}

async function editUser(id, plan, isActive) {
  const overlay = document.getElementById("modal-overlay") || createModal();
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      <h3>Edit User</h3>
      <p>Update user permissions and status</p>
      <label>Plan tier</label>
      <select id="edit-plan"><option value="free" ${plan==='free'?'selected':''}>Free</option><option value="pro" ${plan==='pro'?'selected':''}>Pro</option><option value="enterprise" ${plan==='enterprise'?'selected':''}>Enterprise</option></select>
      <label>Status</label>
      <select id="edit-active"><option value="true" ${isActive?'selected':''}>Active</option><option value="false" ${!isActive?'selected':''}>Inactive</option></select>
      <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveUser('${id}')">Save</button></div>
    </div>`;
  overlay.classList.add("show");
}

async function saveUser(id) {
  const plan = document.getElementById("edit-plan").value;
  const active = document.getElementById("edit-active").value === "true";
  await apiPatch(`/admin/users/${id}`, { plan_tier: plan, is_active: active });
  closeModal();
  renderTab(curTab);
}

function createModal() {
  const el = document.createElement("div");
  el.id = "modal-overlay";
  el.className = "modal-overlay";
  el.onclick = (e) => { if (e.target === el) closeModal(); };
  document.body.appendChild(el);
  return el;
}

function closeModal() {
  const el = document.getElementById("modal-overlay");
  if (el) el.classList.remove("show");
}

/* Profiles */
let profilesPage = 1;
async function renderProfiles(main) {
  main.innerHTML = `<div class="page-title">Profiles</div><div class="page-desc">View and manage all diaspora profiles</div><div class="loading"><i class="ti ti-loader"></i><p>Loading...</p></div>`;
  try {
    const d = await apiGet(`/admin/profiles?page=${profilesPage}&page_size=50`);
    main.innerHTML = `
      <div class="page-title">Profiles</div><div class="page-desc">View and manage all diaspora profiles</div>
      <div class="table-wrap">
        <div class="tw-h"><h3>All profiles (${d.total})</h3></div>
        <table><thead><tr><th>Name</th><th>Segment</th><th>Origin</th><th>Country</th><th>Source</th><th>Active</th><th>Created</th><th>Actions</th></tr></thead><tbody>
          ${d.items.map(p => `<tr>
            <td>${p.name}</td>
            <td>${p.segment||"—"}</td>
            <td>${p.origin||"—"}</td>
            <td>${p.country_of_residence||"—"}</td>
            <td>${p.source}</td>
            <td><span class="badge ${p.is_active?'badge-green':'badge-red'}">${p.is_active?'Active':'Inactive'}</span></td>
            <td>${p.created_at?.slice(0,10)||"—"}</td>
            <td><button class="btn-sm" onclick="editProfile('${p.id}','${p.segment||''}','${p.origin||''}',${p.is_active})"><i class="ti ti-edit"></i></button> <button class="btn-sm danger" onclick="deleteProfile('${p.id}')"><i class="ti ti-trash"></i></button></td>
          </tr>`).join("")}
        </tbody></table>
        <div class="pagination"><button onclick="profilesPage--;renderProfiles(document.getElementById('admin-main'))" ${profilesPage<=1?'disabled':''}>Prev</button><span>Page ${d.page} of ${Math.ceil(d.total/d.page_size)}</span><button onclick="profilesPage++;renderProfiles(document.getElementById('admin-main'))" ${d.page*d.page_size>=d.total?'disabled':''}>Next</button></div>
      </div>`;
  } catch { main.innerHTML = `<div class="page-title">Profiles</div><div class="page-desc">View and manage profiles</div><div class="empty"><i class="ti ti-cloud-off"></i><p>Could not load profiles</p></div>`; }
}

async function editProfile(id, segment, origin, isActive) {
  const overlay = createModal();
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      <h3>Edit Profile</h3>
      <p>Update profile metadata</p>
      <label>Segment</label>
      <select id="ep-segment"><option value="">None</option><option value="people" ${segment==='people'?'selected':''}>People</option><option value="leaders" ${segment==='leaders'?'selected':''}>Leaders</option><option value="entrepreneurs" ${segment==='entrepreneurs'?'selected':''}>Entrepreneurs</option><option value="investors" ${segment==='investors'?'selected':''}>Investors</option></select>
      <label>Origin</label>
      <select id="ep-origin"><option value="">None</option><option value="gh" ${origin==='gh'?'selected':''}>Ghana</option><option value="africa" ${origin==='africa'?'selected':''}>Africa</option></select>
      <label>Status</label>
      <select id="ep-active"><option value="true" ${isActive?'selected':''}>Active</option><option value="false" ${!isActive?'selected':''}>Inactive</option></select>
      <div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">Cancel</button><button class="btn-save" onclick="saveProfile('${id}')">Save</button></div>
    </div>`;
  overlay.classList.add("show");
}

async function saveProfile(id) {
  const segment = document.getElementById("ep-segment").value || null;
  const origin = document.getElementById("ep-origin").value || null;
  const isActive = document.getElementById("ep-active").value === "true";
  await apiPatch(`/admin/profiles/${id}`, { segment, origin, is_active: isActive });
  closeModal();
  renderTab(curTab);
}

async function deleteProfile(id) {
  if (!confirm("Deactivate this profile?")) return;
  await apiDelete(`/admin/profiles/${id}`);
  renderTab(curTab);
}

/* Orgs */
let orgsPage = 1;
async function renderOrgs(main) {
  main.innerHTML = `<div class="page-title">Organisations</div><div class="page-desc">View and manage all organisations</div><div class="loading"><i class="ti ti-loader"></i><p>Loading...</p></div>`;
  try {
    const d = await apiGet(`/admin/orgs?page=${orgsPage}&page_size=50`);
    main.innerHTML = `
      <div class="page-title">Organisations</div><div class="page-desc">View and manage all organisations</div>
      <div class="table-wrap">
        <div class="tw-h"><h3>All orgs (${d.total})</h3></div>
        <table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Country</th><th>Profiles</th><th>Created</th><th>Actions</th></tr></thead><tbody>
          ${d.items.map(o => `<tr>
            <td>${o.name}</td>
            <td>${o.org_type||"—"}</td>
            <td><span class="badge ${o.status==='active'?'badge-green':'badge-gold'}">${o.status||"—"}</span></td>
            <td>${o.country||"—"}</td>
            <td>${o.profile_count||0}</td>
            <td>${o.created_at?.slice(0,10)||"—"}</td>
            <td><button class="btn-sm" onclick="editOrg('${o.id}','${o.org_type||''}')"><i class="ti ti-edit"></i></button> <button class="btn-sm danger" onclick="deleteOrg('${o.id}')"><i class="ti ti-trash"></i></button></td>
          </tr>`).join("")}
        </tbody></table>
        <div class="pagination"><button onclick="orgsPage--;renderOrgs(document.getElementById('admin-main'))" ${orgsPage<=1?'disabled':''}>Prev</button><span>Page ${d.page} of ${Math.ceil(d.total/d.page_size)}</span><button onclick="orgsPage++;renderOrgs(document.getElementById('admin-main'))" ${d.page*d.page_size>=d.total?'disabled':''}>Next</button></div>
      </div>`;
  } catch { main.innerHTML = `<div class="page-title">Organisations</div><div class="page-desc">View and manage orgs</div><div class="empty"><i class="ti ti-cloud-off"></i><p>Could not load orgs</p></div>`; }
}

async function editOrg(id, orgType) {
  const overlay = createModal();
  overlay.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeModal()"><i class="ti ti-x"></i></button>
      <h3>Edit Organisation</h3>
      <p>Update org metadata</p>
      <label>Org type</label>
      <select id="eo-type"><option value="">None</option><option value="association" ${orgType==='association'?'selected':''}>Association</option><option value="investment" ${orgType==='investment'?'selected':''}>Investment</option><option value="professional" ${orgType==='professional'?'selected':''}>Professional</option><option value="community" ${orgType==='community'?'selected':''}>Community</option><option value="cultural" ${orgType==='cultural'?'selected':''}>Cultural</option><option value="think-tank" ${orgType==='think-tank'?'selected':''}>Think Tank</option></select>

    </div>`;
  overlay.classList.add("show");
}

async function saveOrg(id) {
  const orgType = document.getElementById("eo-type").value || null;
  await apiPatch(`/admin/orgs/${id}`, { org_type: orgType });
  closeModal();
  renderTab(curTab);
}

async function deleteOrg(id) {
  if (!confirm("Permanently delete this org?")) return;
  await apiDelete(`/admin/orgs/${id}`);
  renderTab(curTab);
}

/* Import */
async function renderImport(main) {
  main.innerHTML = `
    <div class="page-title">Data Import</div>
    <div class="page-desc">Trigger and monitor Companies House data ingestion</div>
    <div class="import-box">
      <div class="ib-icon"><i class="ti ti-database-import"></i></div>
      <h3>Companies House Import</h3>
      <p>Fetch diaspora officer and company records from the official UK register. Import runs asynchronously and may take several minutes depending on data volume.</p>
      <button id="import-btn" onclick="triggerImport()"><i class="ti ti-sparkles"></i> Trigger import</button>
    </div>
    <div class="table-wrap">
      <div class="tw-h"><h3>Import history</h3></div>
      <div class="empty" id="import-status"><i class="ti ti-clock"></i><p>No import history yet</p></div>
    </div>`;
}

async function triggerImport() {
  const btn = document.getElementById("import-btn");
  btn.disabled = true; btn.textContent = "Triggering...";
  try {
    const r = await apiPost("/admin/import/trigger");
    document.getElementById("import-status").innerHTML = `<i class="ti ti-check" style="color:var(--gl);"></i><p style="color:var(--gl);">${r.message}</p>`;
  } catch { document.getElementById("import-status").innerHTML = `<i class="ti ti-x" style="color:var(--red);"></i><p style="color:var(--red);">Import failed</p>`; }
  btn.disabled = false; btn.innerHTML = '<i class="ti ti-sparkles"></i> Trigger import';
}

/* Health */
async function renderHealth(main) {
  main.innerHTML = `<div class="page-title">System Health</div><div class="page-desc">Monitor API and database status</div><div class="loading"><i class="ti ti-loader"></i><p>Checking...</p></div>`;
  try {
    const d = await apiGet("/admin/health");
    main.innerHTML = `
      <div class="page-title">System Health</div>
      <div class="page-desc">Monitor API and database status</div>
      <div class="health-grid">
        <div class="health-item"><div class="hi-label">API Status</div><div class="hi-val ok"><i class="ti ti-circle-check"></i> ${d.api}</div></div>
        <div class="health-item"><div class="hi-label">Database</div><div class="hi-val ${d.database==='connected'?'ok':'fail'}"><i class="ti ti-${d.database==='connected'?'circle-check':'circle-x'}"></i> ${d.database}</div></div>
        <div class="health-item"><div class="hi-label">Version</div><div class="hi-val">${d.version}</div></div>
      </div>
      <div class="table-wrap">
        <div class="tw-h"><h3>Environment</h3></div>
        <table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody>
          <tr><td>Environment</td><td>${d.environment}</td></tr>
        </tbody></table>
      </div>`;
  } catch {
    main.innerHTML = `<div class="page-title">System Health</div><div class="page-desc">Monitor API and database status</div><div class="empty"><i class="ti ti-cloud-off"></i><p>Could not reach API</p></div>`;
  }
}

/* Init */
if (adminKey) {
  apiGet("/admin/verify").then(d => {
    if (d.status === "ok") {
      document.getElementById("login-page").style.display = "none";
      document.getElementById("admin-app").style.display = "";
      switchTab("overview");
    }
  }).catch(() => {
    localStorage.removeItem(ADMIN_KEY);
    adminKey = "";
  });
}
